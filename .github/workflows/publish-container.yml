name: Container veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oracle-reader-container
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Regressionstests ausführen
        run: npm test

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten erzeugen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/maroishiku/orac_reader
          tags: |
            type=raw,value=latest
            type=sha

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
